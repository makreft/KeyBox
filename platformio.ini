; KeyBox - Arduino M0 Pro + M5Stack Unit RFID2 (WS1850S)
;
; Build-Environments:
;   m0pro         -> Hauptprogramm, Upload/Serial ueber den Programming-Port (Standard)
;   m0pro_native  -> Hauptprogramm, Upload/Serial ueber den Native-USB-Port
;
; Die Diagnose-Sketches (I2C-Scanner, Registertest, Test auf dem zweiten Bus)
; sind entfernt - sie haben ihren Zweck erfuellt. Was von ihnen gebraucht wird,
; steckt jetzt in main.cpp: Test der Busleitungen beim Start und ein Scan des
; Busses, falls die konfigurierte Adresse nicht antwortet. Die Erkenntnisse
; dazu stehen im README.
;
; Jedes Environment listet seine Quelldatei explizit auf (Whitelist statt
; "+<*> -<...>"). Sonst zieht jede neue Datei in src/ ein zweites setup()/loop()
; in alle Environments und der Link bricht.
;
; ---------------------------------------------------------------------------
; WICHTIG - nach jedem Upload das Board vom USB trennen und neu anstecken!
;
; Der M0 Pro hat einen SAM-BA-Bootloader in den ersten 16 KB (per BOOTPROT-Fuse
; schreibgeschuetzt), der die App bei 0x4000 anspringt. Er erkennt einen
; Doppel-Reset ueber einen Magic-Value im RAM und wartet dann auf einen Upload
; statt zu starten. OpenOCDs "reset" am Ende des Uploads zaehlt fuer ihn wie so
; ein Tastendruck, und ein SRST loescht den RAM nicht. Ergebnis: der Upload
; meldet "Verified OK", danach startet die Firmware aber nicht und es kommt
; keine serielle Ausgabe.
;
; Ein Power-Cycle (USB abziehen, neu anstecken) loescht den Magic-Value, und
; die Firmware laeuft. Der Reset-Knopf allein genuegt nicht zuverlaessig.
;
; Nicht versuchen, das ueber flash_without_bootloader.ld und
; offset_address = 0x0 zu "loesen" - die Bootloader-Region ist per BOOTPROT
; gesperrt, OpenOCD scheitert dort mit "SAMD: NVM lock error".
; ---------------------------------------------------------------------------

; Ohne default_envs wuerde ein pauschales "Build"/"Upload" alle vier
; Environments nacheinander abarbeiten. Einzelne Envs (z. B. i2cscan) laufen
; ueber "pio run -e i2cscan" bzw. die Project Tasks in der Seitenleiste.
[platformio]
default_envs = m0pro

[env]
platform = atmelsam
framework = arduino
monitor_speed = 115200
; Mit Sternchen, weil die Nummer nach einem Umstecken wechselt
; (schon von ttyACM0 auf ttyACM1 beobachtet) und auf dieser Maschine
; zusaetzlich 32 Legacy-/dev/ttyS*-Ports herumliegen.
monitor_port = /dev/ttyACM*
lib_deps =
	https://github.com/kkloesener/MFRC522_I2C.git

[env:m0pro]
board = mzeropro
build_src_filter = +<main.cpp>

; Flasht ueber den SAM-BA-Bootloader am Native-USB-Port (bossac) statt ueber
; den EDBG-Debugger. Dort ist der Doppel-Reset erwuenscht, um in den Bootloader
; zu kommen. Setzt voraus, dass der Native-USB-Port angeschlossen ist.
[env:m0pro_native]
board = mzeroproUSB
build_flags = -D KEYBOX_USE_NATIVE_USB
build_src_filter = +<main.cpp>
